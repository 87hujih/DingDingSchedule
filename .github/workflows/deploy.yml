name: Deploy to Server

on:
  push:
    branches:
      - master  # 推送到 master 分支时触发
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      SERVER_SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize image repository
        shell: bash
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/schedule-server" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SERVER_HOST}" ]; then
            echo "Missing SERVER_HOST secret"
            exit 1
          fi

          if [ -z "${SERVER_USER}" ]; then
            echo "Missing SERVER_USER secret"
            exit 1
          fi

          if [ -z "${SERVER_SSH_KEY}" ] && [ -z "${SERVER_PASSWORD}" ]; then
            echo "Either SERVER_SSH_KEY or SERVER_PASSWORD must be configured"
            exit 1
          fi

          if [ -n "${SERVER_SSH_KEY}" ]; then
            echo "Using SSH key authentication"
          else
            echo "Using password authentication fallback"
          fi

      - name: Debug SSH key fingerprint
        if: ${{ env.SERVER_SSH_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Target: ${SERVER_USER}@${SERVER_HOST}"

          tmp="$(mktemp)"
          trap 'rm -f "${tmp}" "${tmp}.pub"' EXIT

          printf '%s\n' "${SERVER_SSH_KEY}" > "${tmp}"
          chmod 600 "${tmp}"

          ssh-keygen -y -f "${tmp}" > "${tmp}.pub"
          echo "Secret-backed public key fingerprint:"
          ssh-keygen -lf "${tmp}.pub"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Sync deployment assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          source: "deploy.sh,docker-compose.prod.yml,.env.prod.example"
          target: "/opt/schedule_server"

      - name: Execute deployment script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            set -e
            IMAGE_REPO="${{ env.IMAGE_REPO }}"
            IMAGE_TAG="${{ github.sha }}"

            if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi

            mkdir -p /opt/schedule_server/logs /opt/schedule_server/uploads /opt/schedule_server/configs
            cd /opt/schedule_server

            if [ ! -f .env.prod ]; then
              cp .env.prod.example .env.prod
              echo ".env.prod 不存在，已写入模板，请补全后重新执行部署。"
              exit 1
            fi

            chmod +x deploy.sh
            IMAGE_REPO="$IMAGE_REPO" IMAGE_TAG="$IMAGE_TAG" ./deploy.sh deploy

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            set -e

            for attempt in $(seq 1 12); do
              if curl -fsS http://localhost:26665/health >/dev/null; then
                echo "Health check passed"
                exit 0
              fi

              if [ "${attempt}" -lt 12 ]; then
                sleep 5
              fi
            done

            echo "Health check failed after waiting for service readiness."
            docker ps --filter "name=schedule-server"
            docker logs --tail 100 schedule-server || true
            exit 1

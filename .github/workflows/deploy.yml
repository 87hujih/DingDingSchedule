name: Deploy to Server

on:
  push:
    branches:
      - master  # 推送到 master 分支时触发
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      SERVER_SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize deployment settings
        shell: bash
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/schedule-server" >> "$GITHUB_ENV"
          echo "SERVER_PORT=${SERVER_PORT:-22}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SERVER_HOST}" ]; then
            echo "Missing SERVER_HOST secret"
            exit 1
          fi

          if [ -z "${SERVER_USER}" ]; then
            echo "Missing SERVER_USER secret"
            exit 1
          fi

          if [ -z "${SERVER_SSH_KEY}" ] && [ -z "${SERVER_PASSWORD}" ]; then
            echo "Either SERVER_SSH_KEY or SERVER_PASSWORD must be configured"
            exit 1
          fi

          if ! [[ "${SERVER_PORT}" =~ ^[0-9]+$ ]]; then
            echo "SERVER_PORT must be numeric when configured"
            exit 1
          fi

          echo "Using SSH port ${SERVER_PORT}"

          if [ -n "${SERVER_SSH_KEY}" ]; then
            echo "Using SSH key authentication"
          else
            echo "Using password authentication fallback"
          fi

      - name: Debug SSH key fingerprint
        if: ${{ env.SERVER_SSH_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Target: ${SERVER_USER}@${SERVER_HOST}:${SERVER_PORT}"

          tmp="$(mktemp)"
          trap 'rm -f "${tmp}" "${tmp}.pub"' EXIT

          printf '%s\n' "${SERVER_SSH_KEY}" > "${tmp}"
          chmod 600 "${tmp}"

          ssh-keygen -y -f "${tmp}" > "${tmp}.pub"
          echo "Secret-backed public key fingerprint:"
          ssh-keygen -lf "${tmp}.pub"

      - name: Verify SSH connectivity
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking TCP connectivity to ${SERVER_HOST}:${SERVER_PORT}"

          if timeout 5 bash -lc "true >/dev/tcp/${SERVER_HOST}/${SERVER_PORT}" 2>/dev/null; then
            echo "SSH port is reachable from the GitHub runner"
          else
            echo "Cannot reach ${SERVER_HOST}:${SERVER_PORT} from the GitHub runner"
            exit 1
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Pull deployment image to runner
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          docker pull "${IMAGE_REPO}:${GITHUB_SHA}"

      - name: Deploy through SSH master connection
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail

          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"
          KNOWN_HOSTS="${SSH_DIR}/known_hosts"
          CONTROL_PATH="${SSH_DIR}/control.sock"
          REMOTE="${SERVER_USER}@${SERVER_HOST}"

          mkdir -p "${SSH_DIR}"
          touch "${KNOWN_HOSTS}"
          chmod 700 "${SSH_DIR}"
          chmod 600 "${KNOWN_HOSTS}"

          SSH_CMD=(ssh)
          SCP_CMD=(scp)
          SSH_AUTH_OPTS=()
          SCP_AUTH_OPTS=()

          if [ -n "${SERVER_SSH_KEY}" ]; then
            KEY_PATH="${SSH_DIR}/id_deploy"
            printf '%s\n' "${SERVER_SSH_KEY}" > "${KEY_PATH}"
            chmod 600 "${KEY_PATH}"
            SSH_AUTH_OPTS=(-i "${KEY_PATH}")
            SCP_AUTH_OPTS=(-i "${KEY_PATH}")
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
            export SSHPASS="${SERVER_PASSWORD}"
            SSH_CMD=(sshpass -e ssh)
            SCP_CMD=(sshpass -e scp)
          fi

          SSH_OPTS=(
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="${KNOWN_HOSTS}"
            -o BatchMode=yes
            -o ControlMaster=auto
            -o ControlPersist=600
            -o ControlPath="${CONTROL_PATH}"
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
            -p "${SERVER_PORT}"
          )
          SCP_OPTS=(
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="${KNOWN_HOSTS}"
            -o BatchMode=yes
            -o ControlMaster=auto
            -o ControlPersist=600
            -o ControlPath="${CONTROL_PATH}"
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
            -P "${SERVER_PORT}"
          )

          cleanup() {
            "${SSH_CMD[@]}" "${SSH_AUTH_OPTS[@]}" "${SSH_OPTS[@]}" -O exit "${REMOTE}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "${SSH_CMD[@]}" "${SSH_AUTH_OPTS[@]}" "${SSH_OPTS[@]}" -MNf "${REMOTE}"

          "${SSH_CMD[@]}" "${SSH_AUTH_OPTS[@]}" "${SSH_OPTS[@]}" "${REMOTE}" "mkdir -p /opt/schedule_server/logs /opt/schedule_server/uploads /opt/schedule_server/configs"

          "${SCP_CMD[@]}" "${SCP_AUTH_OPTS[@]}" "${SCP_OPTS[@]}" deploy.sh docker-compose.prod.yml .env.prod.example "${REMOTE}:/opt/schedule_server/"

          docker save "${IMAGE_REPO}:${IMAGE_TAG}" | "${SSH_CMD[@]}" "${SSH_AUTH_OPTS[@]}" "${SSH_OPTS[@]}" "${REMOTE}" "docker load"

          "${SSH_CMD[@]}" "${SSH_AUTH_OPTS[@]}" "${SSH_OPTS[@]}" "${REMOTE}" /bin/bash <<EOF
          set -euo pipefail

          cd /opt/schedule_server

          if [ ! -f .env.prod ]; then
            cp .env.prod.example .env.prod
            echo ".env.prod 不存在，已写入模板，请补全后重新执行部署。"
            exit 1
          fi

          chmod +x deploy.sh
          IMAGE_REPO="${IMAGE_REPO}" IMAGE_TAG="${IMAGE_TAG}" SKIP_IMAGE_PULL=1 ./deploy.sh deploy

          for attempt in \$(seq 1 12); do
            if curl -fsS http://localhost:26665/health >/dev/null; then
              echo "Health check passed"
              exit 0
            fi

            if [ "\${attempt}" -lt 12 ]; then
              sleep 5
            fi
          done

          echo "Health check failed after waiting for service readiness."
          docker ps --filter "name=schedule-server"
          docker logs --tail 100 schedule-server || true
          exit 1
          EOF

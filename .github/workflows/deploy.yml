name: Deploy to Server

on:
  push:
    branches:
      - master  # 推送到 master 分支时触发
  workflow_dispatch:  # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t schedule-server:${{ github.sha }} .
          docker tag schedule-server:${{ github.sha }} schedule-server:latest

      - name: Save Docker image
        run: docker save schedule-server:latest | gzip > schedule-server.tar.gz

      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "schedule-server.tar.gz,deploy.sh,docker-compose.yml,configs/dev.yaml"
          target: "/opt/schedule_server"

      - name: Execute deployment script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/schedule_server
            docker load < schedule-server.tar.gz
            chmod +x deploy.sh
            ./deploy.sh deploy
            rm schedule-server.tar.gz

      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ secrets.SERVER_HOST }}:26665/health || exit 1

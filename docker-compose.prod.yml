version: '3.8'

services:
  schedule-server:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    container_name: schedule-server
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-26665}:26665"
    environment:
      APP_ENV: "${APP_ENV:-prod}"
      CONFIG_ENV: "${CONFIG_ENV:-prod}"
      CONFIG_PATH: /app/configs
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - "${CONFIG_DIR:-./configs}:/app/configs:ro"
      - "${LOG_DIR:-./logs}:/app/logs"
      - "${UPLOAD_DIR:-./uploads}:/app/uploads"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:26665/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - schedule-network

networks:
  schedule-network:
    driver: bridge
